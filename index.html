<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Walk Save File Editor</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1e;
      --card-border: #2c2d35;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    h1, h2, h3 { margin-top: 0; }
    h1 { font-size: 1.75rem; margin-bottom: 1.5rem; text-align: center; }

    .drop-zone {
      border: 2px dashed var(--card-border);
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      margin-bottom: 1.5rem;
    }
    .drop-zone:hover { border-color: var(--accent); background: #222228; }
    .drop-zone p { margin: 0; color: var(--text-muted); }
    .drop-zone strong { color: var(--accent); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Native Accordion Styling */
    details.card summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-size: 1.15rem;
      font-weight: 600;
      list-style: none;
    }
    details.card summary::-webkit-details-marker { display: none; }
    details.card summary::after {
      content: "▾";
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    details.card[open] summary::after {
      transform: rotate(180deg);
    }
    .collapsible-body {
      padding-top: 1.25rem;
      cursor: default;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 0.75rem;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #141417;
      border: 1px solid var(--card-border);
      border-radius: 8px;
    }
    .toggle-row span { font-size: 0.95rem; font-weight: 500; }

    /* Switch Component */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #374151;
      transition: .2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Inventory Section */
    .search-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .search-bar input {
      flex: 1;
      padding: 0.65rem 1rem;
      background: #141417;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .search-bar input:focus { outline: 1px solid var(--accent); }

    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }

    .inventory-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 48px;
      padding: 0.75rem;
      background: #141417;
      border: 1px solid var(--card-border);
      border-radius: 8px;
    }
    .empty-msg {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: auto;
    }

    .item-chip {
      background: #24242a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
    }
    .item-chip button {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-weight: bold;
      padding: 0;
      font-size: 1rem;
      line-height: 1;
    }

    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>Big Walk Save File Editor</h1>

  <div id="dropZone" class="drop-zone">
    <p>📁 Drag and drop <strong>save_file.sav</strong> here, or click to choose file</p>
    <input type="file" id="fileInput" class="hidden" accept=".sav,.json">
  </div>

  <div id="editorContent" class="hidden">
    <div class="action-header">
      <h2>Save Editor</h2>
      <button id="exportBtn" class="btn">💾 Export Save File</button>
    </div>

    <!-- Gates & Zone Unlocks (Collapsible, starts closed) -->
    <details class="card">
      <summary>Gates & Zone Unlocks</summary>
      <div class="collapsible-body">
        <div id="unlocksContainer" class="grid-2"></div>
      </div>
    </details>

    <!-- Radio Stations (Collapsible, starts closed) -->
    <details class="card">
      <summary>Radio Stations</summary>
      <div class="collapsible-body">
        <div id="radiosContainer" class="grid-2"></div>
      </div>
    </details>

    <!-- Inventory Items -->
    <div class="card">
      <h3>Inventory Items</h3>
      <div class="search-bar">
        <input type="text" id="itemSearch" list="availableItemsList" placeholder="Search item to add (e.g. Compass, Flashlight)...">
        <datalist id="availableItemsList"></datalist>
        <button id="addItemBtn" class="btn">Add Item</button>
      </div>
      <div id="inventoryContainer" class="inventory-list"></div>
    </div>
  </div>
</div>

<!-- Load Database Definitions -->
<script src="database.js"></script>

<script>
  let savePayload = null;
  const ITEM_LABEL_TO_ID = {};

  // DOM Elements
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const editorContent = document.getElementById('editorContent');
  const unlocksContainer = document.getElementById('unlocksContainer');
  const radiosContainer = document.getElementById('radiosContainer');
  const inventoryContainer = document.getElementById('inventoryContainer');
  const availableItemsList = document.getElementById('availableItemsList');
  const itemSearch = document.getElementById('itemSearch');
  const addItemBtn = document.getElementById('addItemBtn');
  const exportBtn = document.getElementById('exportBtn');

  // Initialize lookup maps and UI datalist using external database.js
  function initDatabaseMappings() {
    if (typeof INVENTORY_DATABASE === 'undefined') return;

    for (const [id, label] of Object.entries(INVENTORY_DATABASE)) {
      ITEM_LABEL_TO_ID[label.toLowerCase()] = id;
    }

    Object.values(INVENTORY_DATABASE).sort().forEach(label => {
      const opt = document.createElement('option');
      opt.value = label;
      availableItemsList.appendChild(opt);
    });
  }

  // File loading
  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = (e) => loadFile(e.target.files[0]);
  dropZone.ondragover = (e) => e.preventDefault();
  dropZone.ondrop = (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  };

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        savePayload = JSON.parse(e.target.result);
        if (!Array.isArray(savePayload.entries)) savePayload.entries = [];
        if (!Array.isArray(savePayload.inventory)) savePayload.inventory = [];
        renderUI();
        dropZone.classList.add('hidden');
        editorContent.classList.remove('hidden');
      } catch (err) {
        alert("Could not parse file. Please upload a valid Big Walk save file.");
      }
    };
    reader.readAsText(file);
  }

  function isKeyPresent(key) {
    return savePayload.entries.some(item => item && item.key === key);
  }

  function setKeyPresent(key, isEnabled, defaultValue) {
    const index = savePayload.entries.findIndex(item => item && item.key === key);
    if (isEnabled && index === -1) {
      savePayload.entries.push({ key: key, value: defaultValue });
    } else if (!isEnabled && index !== -1) {
      savePayload.entries.splice(index, 1);
    }
  }

  function renderToggleGroup(container, definitions) {
    container.innerHTML = '';
    if (!definitions) return;
    definitions.forEach(def => {
      const active = isKeyPresent(def.key);
      const row = document.createElement('div');
      row.className = 'toggle-row';
      row.innerHTML = `
        <span>${def.label}</span>
        <label class="switch">
          <input type="checkbox" ${active ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      `;
      row.querySelector('input').addEventListener('change', (e) => {
        setKeyPresent(def.key, e.target.checked, def.value);
      });
      container.appendChild(row);
    });
  }

  function renderUI() {
    renderToggleGroup(unlocksContainer, UNLOCK_DEFINITIONS);
    renderToggleGroup(radiosContainer, RADIO_DEFINITIONS);
    renderInventory();
  }

  function renderInventory() {
    inventoryContainer.innerHTML = '';
    
    // Display only known non-ignored items
    const visibleItems = savePayload.inventory
      .map((id, index) => ({ id, index, label: INVENTORY_DATABASE[id] }))
      .filter(item => Boolean(item.label));

    if (visibleItems.length === 0) {
      inventoryContainer.innerHTML = '<span class="empty-msg">No tracked items in inventory</span>';
      return;
    }

    visibleItems.forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'item-chip';
      chip.innerHTML = `
        <span>${item.label}</span>
        <button title="Remove item">&times;</button>
      `;
      chip.querySelector('button').onclick = () => {
        savePayload.inventory.splice(item.index, 1);
        renderInventory();
      };
      inventoryContainer.appendChild(chip);
    });
  }

  function addInventoryItem() {
    const query = itemSearch.value.trim().toLowerCase();
    const targetId = ITEM_LABEL_TO_ID[query];

    if (targetId) {
      savePayload.inventory.push(targetId);
      itemSearch.value = '';
      renderInventory();
    } else {
      alert("Please select a valid item from the list.");
    }
  }

  addItemBtn.onclick = addInventoryItem;
  itemSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addInventoryItem();
  });

  // Export Modified Save
  exportBtn.onclick = () => {
    const dataStr = JSON.stringify(savePayload, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "save_file.sav";
    a.click();
    URL.revokeObjectURL(url);
  };

  initDatabaseMappings();
</script>
</body>
</html>
