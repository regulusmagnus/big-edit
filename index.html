<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Walk Save File Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Big Walk Save File Editor</h1>

  <div id="dropZone" class="drop-zone">
    <p>📁 Drag and drop <strong>save_file.sav</strong> here, or click to choose file</p>
    <div class="path-helper" id="pathHelper">
      <span>Windows Path:</span>
      <code id="savePathText">%LOCALAPPDATA%Low\House House\Big Walk\user_data\save_games\</code>
      <button type="button" class="btn-sm" id="btnCopyPath">📋 Copy</button>
    </div>
    <input type="file" id="fileInput" class="hidden" accept=".sav,.json">
  </div>

  <div id="editorContent" class="hidden">
    <div class="action-header">
      <h2>Save Editor</h2>
      <button id="exportBtn" class="btn">💾 Export Save File</button>
    </div>

    <!-- Gates & Zone Unlocks (Collapsible) -->
    <details class="card">
      <summary>Gates & Zone Unlocks</summary>
      <div class="collapsible-body">
        <div class="section-toolbar">
          <button class="btn-sm" id="btnDisableAllUnlocks">Disable All</button>
          <button class="btn-sm" id="btnEnableAllUnlocks">Enable All</button>
        </div>
        <div id="unlocksContainer" class="grid-2"></div>
      </div>
    </details>

    <!-- Endgame Gauntlet (Collapsible) -->
    <details class="card">
      <summary>Endgame Gauntlet</summary>
      <div class="collapsible-body">
        <div class="section-toolbar">
          <button class="btn-sm" id="btnDisableAllGauntlet">Disable All</button>
          <button class="btn-sm" id="btnEnableAllGauntlet">Enable All</button>
        </div>
        <div id="gauntletContainer" class="grid-2"></div>
      </div>
    </details>

    <!-- Radio Stations (Collapsible) -->
    <details class="card">
      <summary>Radio Stations</summary>
      <div class="collapsible-body">
        <div class="section-toolbar">
          <button class="btn-sm" id="btnDisableAllRadios">Disable All</button>
          <button class="btn-sm" id="btnEnableAllRadios">Enable All</button>
        </div>
        <div id="radiosContainer" class="grid-2"></div>
      </div>
    </details>

    <!-- Orb Beacons (Collapsible) -->
    <details class="card">
      <summary>Orb Beacons</summary>
      <div class="collapsible-body">
        <div class="section-toolbar">
          <button class="btn-sm" id="btnAllBeaconsOff">All Off</button>
          <button class="btn-sm" id="btnAllBeaconsOn">All On</button>
          <button class="btn-sm" id="btnAllBeaconsInv">All in Inventory</button>
        </div>
        <div id="orbBeaconsContainer" class="grid-2"></div>
      </div>
    </details>

    <!-- Gourds (Collapsible) -->
    <details class="card">
      <summary>Gourds</summary>
      <div class="collapsible-body">
        <div class="section-toolbar">
          <button class="btn-sm" id="btnAllGourdsUnsolved">All Unsolved</button>
          <button class="btn-sm" id="btnAllGourdsPuzzle">All at Puzzle</button>
          <button class="btn-sm" id="btnAllGourdsInventory">All in Inventory</button>
          <button class="btn-sm" id="btnAllGourdsPlaced">All Placed</button>
        </div>
        <div id="gourdsContainer"></div>
      </div>
    </details>

    <!-- Character Colors (Collapsible) -->
    <details class="card">
      <summary>Character Colors</summary>
      <div class="collapsible-body">
        <div class="section-toolbar">
          <button class="btn-sm" id="btnLookupAllSteam">Lookup All Steam Names</button>
        </div>
        <div id="characterColorsContainer"></div>
      </div>
    </details>

    <!-- Inventory Items -->
    <div class="card">
      <h3>Inventory Items</h3>
      <div class="search-bar">
        <input type="text" id="itemSearch" list="availableItemsList" placeholder="Search item to add (e.g. Compass, Flashlight)...">
        <datalist id="availableItemsList"></datalist>
        <button id="addItemBtn" class="btn">Add Item</button>
      </div>
      <div id="inventoryContainer" class="inventory-list"></div>
    </div>
  </div>
</div>

<!-- Load Database Definitions and Main Controller Logic -->
<script src="database.js"></script>
<script src="app.js"></script>
</body>
</html>
